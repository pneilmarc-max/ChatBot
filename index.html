<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Paws & Whiskers – Support Bot</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 700px;
        }

        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 18px 24px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .chat-header p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fefefe;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            max-width: 85%;
        }

        .user-message {
            justify-content: flex-end;
            align-self: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
            align-self: flex-start;
        }

        .bubble {
            padding: 10px 16px;
            border-radius: 24px;
            line-height: 1.4;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .user-message .bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot-message .bubble {
            background: #e9ecef;
            color: #1e2a3a;
            border-bottom-left-radius: 6px;
        }

        .quick-replies {
            padding: 12px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .quick-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
        }

        .quick-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .input-area {
            display: flex;
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .input-area input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.2);
        }

        .input-area button {
            background: #007bff;
            border: none;
            color: white;
            padding: 0 22px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-area button:hover {
            background: #0056b3;
        }

        .typing {
            font-size: 0.8rem;
            color: #6c757d;
            padding: 5px 0 0 12px;
            display: none;
        }

        .footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 10px;
            background: #f8fafc;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>🐾 Paws & Whiskers Co.</h2>
        <p>Pet supplies support – ask about orders, returns, damages & more</p>
    </div>

    <div class="messages-area" id="messagesArea">
        <div class="message bot-message">
            <div class="bubble">👋 Hello! How can I help you today? Choose a quick question or type yours below.</div>
        </div>
    </div>

    <div class="quick-replies" id="quickReplies"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
        <button id="sendBtn">Send</button>
    </div>
    <div class="typing" id="typingIndicator">🐾 Bot is thinking...</div>
    <div class="footer">Demo chatbot – connected to n8n workflow</div>
</div>

<script>
    // ======================= CONFIGURATION =======================
    // 🔁 REPLACE THIS URL WITH YOUR ACTUAL N8N WEBHOOK URL
    const WEBHOOK_URL = "https://n8n.n8ncreation.cc/webhook-test/b3bcb54a-d525-4187-a716-1a6c4eae8466";

    // Quick reply options (label & value sent to webhook)
    const QUICK_OPTIONS = [
        { label: "📦 Where is my order?", value: "Where is my order?" },
        { label: "🔄 How do I return an item?", value: "How do I return an item?" },
        { label: "💔 My item is damaged", value: "My item is damaged" },
        { label: "❌ Cancel my order", value: "Cancel my order" },
        { label: "🏷️ Discount code?", value: "Discount code?" },
        { label: "🐱 Are cat toys safe?", value: "Are cat toys safe?" },
        { label: "💰 Refund policy", value: "Refund policy" }
    ];

    // ======================= DOM elements =======================
    const messagesDiv = document.getElementById('messagesArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // ======================= Helper functions =======================
    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}-message`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        messageDiv.appendChild(bubble);
        messagesDiv.appendChild(messageDiv);
        // Auto-scroll to bottom
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendToWebhook(userMessage) {
        // Disable input & button while waiting
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: userMessage,
                    sessionId: "web_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6)
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            // The reply from n8n is expected in `data.reply`
            const botReply = data.reply || "Sorry, I didn't get a proper response.";
            addMessage(botReply, 'bot');
        } catch (error) {
            console.error('Webhook error:', error);
            addMessage("⚠️ Could not reach the support bot. Please check your connection or try again later.", 'bot');
        } finally {
            typingIndicator.style.display = 'none';
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    function handleUserMessage(messageText) {
        if (!messageText.trim()) return;
        // Show user message in chat
        addMessage(messageText, 'user');
        // Send to webhook
        sendToWebhook(messageText);
    }

    // ======================= Build quick reply buttons =======================
    const quickRepliesDiv = document.getElementById('quickReplies');
    QUICK_OPTIONS.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.innerText = opt.label;
        btn.addEventListener('click', () => {
            handleUserMessage(opt.value);
        });
        quickRepliesDiv.appendChild(btn);
    });

    // ======================= Event listeners =======================
    sendBtn.addEventListener('click', () => {
        const msg = userInput.value.trim();
        if (msg) {
            handleUserMessage(msg);
            userInput.value = '';
        }
    });

    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const msg = userInput.value.trim();
            if (msg) {
                handleUserMessage(msg);
                userInput.value = '';
            }
        }
    });
</script>
</body>
</html>
